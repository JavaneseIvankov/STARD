# STAF-Net | configs/dino_lora.yaml (Person 1, plan §5.2)
seed: 42
manifest: "data/manifests/manifest.csv"
clips_dir: "data/clips"
weights: "~/weights/dinov3-vits16"

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  targets: null   # auto-detected per backend (timm -> qkv, transformers -> q_proj,v_proj)

train:
  epochs: 2
  batch_size: 8
  lora_lr: 1.0e-4
  head_lr: 5.0e-4
  weight_decay: 0.01
  amp_dtype: "bf16"
  num_workers: 4
  patience: 2

output:
  checkpoints_dir: "checkpoints"
  features_dir: "data/features"
  metrics_dir: "results/metrics"
