# STAF-Net | configs/fusion.yaml (Person 3, plan §7.4 & §8)
seed: 42
manifest: "data/manifests/manifest.csv"
features_dir: "data/features"

model:
  d_proj: 256
  hidden_dim: 128
  dropout: 0.2

train:
  lr: 1.0e-3
  weight_decay: 0.01
  batch_size: 64
  max_epochs: 30
  early_stopping_patience: 5

ablations:
  A1: { label: "A1 Frozen DINO",        dino: "dino_frozen", vjepa: null,           mode: "single_dino" }
  A2: { label: "A2 Frozen V-JEPA",      dino: null,          vjepa: "vjepa_frozen", mode: "single_vjepa" }
  A3: { label: "A3 DINO LoRA",          dino: "dino_lora",   vjepa: null,           mode: "single_dino" }
  A4: { label: "A4 V-JEPA LoRA",        dino: null,          vjepa: "vjepa_lora",   mode: "single_vjepa" }
  A5: { label: "A5 Frozen concat",      dino: "dino_frozen", vjepa: "vjepa_frozen", mode: "concat" }
  A6: { label: "A6 Frozen gated",       dino: "dino_frozen", vjepa: "vjepa_frozen", mode: "gated" }
  A7: { label: "A7 Adapted concat",     dino: "dino_lora",   vjepa: "vjepa_lora",   mode: "concat" }
  A8: { label: "A8 STAF-Net (LoRA gated)", dino: "dino_lora", vjepa: "vjepa_lora",  mode: "gated" }

output:
  checkpoints_dir: "checkpoints"
  metrics_dir: "results/metrics"
  plots_dir: "results/plots"
