# STAF-Net | configs/dataset.yaml
seed: 42
preprocessing_version: "clips-v1"

dataset:
  name: "dfdc"
  raw_dir: "data/raw"
  manifest_csv: "data/manifests/manifest.csv"
  clips_dir: "data/clips"
  features_dir: "data/features"

subset:
  target_total: 1500
  train: { real: 525, fake: 525 }
  val:   { real: 112, fake: 112 }
  test:  { real: 113, fake: 113 }

sampling:
  clip_window_sec: 2.0
  num_frames: 16
  dino_frame_indices: [0, 5, 10, 15]
  face_margin: 0.20
  output_size: 384
