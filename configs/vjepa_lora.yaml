# STAF-Net | configs/vjepa_lora.yaml (Person 2, plan §6.2)
seed: 42
manifest: "data/manifests/manifest.csv"
clips_dir: "data/clips"
weights: "~/weights/vjepa2.1-vitb16/hf"

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  targets: null   # auto-detected from VJepaBranch attention projections

train:
  epochs: 2
  batch_size: 2
  grad_accum: 8
  lora_lr: 5.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  amp_dtype: "bf16"
  gradient_checkpointing: true
  num_workers: 4
  patience: 2

output:
  checkpoints_dir: "checkpoints"
  features_dir: "data/features"
  metrics_dir: "results/metrics"
